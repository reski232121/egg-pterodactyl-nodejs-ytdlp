name: Docker Build & Push

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  schedule:
    # Rebuild mingguan (Senin 03:00 UTC): patch keamanan Debian, Node.js, dan yt-dlp terbaru
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      include_eol:
        description: 'Ikut build versi Node.js yang sudah EOL (18, 20, 21, 23, 25)'
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Alias tag
  LATEST_NODE: 24   # :latest
  LTS_NODE: 24      # :node-lts
  CURRENT_NODE: 26  # :node-current

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        env:
          INCLUDE_EOL: ${{ inputs.include_eol }}
        run: |
          matrix=$(jq -cn \
            --argjson supported '[22, 24, 26]' \
            --argjson eol '[18, 20, 21, 23, 25]' \
            --arg include_eol "${INCLUDE_EOL}" '
              ($supported | map({node: ., eol: false}))
              + (if $include_eol == "true" then ($eol | map({node: ., eol: true})) else [] end)
              | {include: .}')
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: node-${{ matrix.node }}
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.eol }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write # untuk cosign keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --- 1. Build amd64 lokal, lalu smoke test + scan ---
      - name: Build image (amd64, untuk test)
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs/${{ matrix.node }}
          platforms: linux/amd64
          load: true
          tags: smoke-test:local
          cache-from: type=gha,scope=node-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh smoke-test:local ${{ matrix.node }}

      - name: Trivy vulnerability scan (laporan, tidak memblokir)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: smoke-test:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '0'

      # --- 2. Build multi-arch + push (lewati saat pull request) ---
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=node-${{ matrix.node }}
            type=raw,value=node-lts,enable=${{ matrix.node == env.LTS_NODE && github.ref_type == 'branch' }}
            type=raw,value=node-current,enable=${{ matrix.node == env.CURRENT_NODE && github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ matrix.node == env.LATEST_NODE && github.ref_type == 'branch' }}
            type=semver,pattern={{version}},suffix=-node-${{ matrix.node }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs/${{ matrix.node }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=node-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}

      # --- 3. Tanda tangan image (keyless) ---
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$TAGS" | sed 's/:.*$//' | sort -u | while read -r image; do
            cosign sign --yes "${image}@${DIGEST}"
          done
