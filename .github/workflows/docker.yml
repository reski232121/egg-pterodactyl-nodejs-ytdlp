name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Versi Node.js yang dipakai untuk tag "latest"
  LATEST_NODE: 24

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=node-${{ matrix.node-version }}
            type=raw,value=latest,enable=${{ matrix.node-version == 24 && github.ref_type == 'branch' }}
            type=semver,pattern={{version}},suffix=-node-${{ matrix.node-version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nodejs/${{ matrix.node-version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-${{ matrix.node-version }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node-version }}
